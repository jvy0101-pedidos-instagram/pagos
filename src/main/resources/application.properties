spring.application.name=pagos
# Puerto local 8084. En Docker, Compose entrega SERVER_PORT=8080.
server.port=${SERVER_PORT:8084}

# Base de datos propia del microservicio (pagos_db).
# createDatabaseIfNotExist crea la base automaticamente en MySQL local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pagos_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Direccion del microservicio Pedidos, que Pagos consulta para validar el monto.
# En tu PC usa el puerto local; en Docker/Swarm se reemplaza con PEDIDOS_URL=http://pedidos:8080.
servicios.pedidos.url=${PEDIDOS_URL:http://localhost:8083}
